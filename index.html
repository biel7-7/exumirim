<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog de tecnologia, desenvolvimento web e programação por Gabriel Costa.">
    <title>Meu Blog Tech | Gabriel Costa</title>
  
    <style>
        /* Variáveis de Cores */
        :root {
            --primary: #183C63;
            --primary-dark: #102a46;
            --accent: #cf1010;
            --accent-hover: #a30c0c;
            --bg-body: #f0f4f8;
            --bg-card: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --code-bg: #f1f5f9;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
        }

        /* Tema Escuro */
        body.dark-mode {
            --bg-body: #121822;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --code-bg: #0f172a;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Cabeçalho Superior */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #ffffff;
            border-bottom: 4px solid var(--accent);
            padding: 20px 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand h1 {
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }

        .brand p {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        /* Navegação e Botão de Tema */
        .nav-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            margin-left: 18px;
            font-size: 0.9
