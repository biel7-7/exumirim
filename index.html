
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direto ao ponto - Blog de Jogos</title>
  <style>
    /* Reset básico corrigido com asterisco (*) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #1c256e;
      line-height: 1.6;
      padding: 20px;
    }

    header {
      background-color: #C1DFFF;
      color: #0d133d;
      text-align: center;
      max-width: 800px;
      margin: 0 auto 24px auto;
      padding: 28px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 6px;
    }

    header p {
      font-size: 1.05rem;
      color: #1c256e;
      margin-bottom: 16px;
    }

    /* Menu de navegação simples */
    nav {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #0d133d;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 16px;
      background-color: rgba(255, 255, 255, 0.6);
      transition: background-color 0.2s;
    }

    nav a:hover {
      background-color: #ffffff;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Estilo de cada postagem */
    article {
      background-color: #FFFFFF;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      display: flex;
      gap: 20px;
      align-items: flex-start;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    article:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
    }

    .logo-post {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #1c256e;
      flex-shrink: 0;
    }

    .conteudo-post {
      flex: 1;
    }

    .tag {
      display: inline-block;
      background-color: #e6f0ff;
      color: #1c256e;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .conteudo-post h2 {
      margin-bottom: 4px;
      color: #0d133d;
      font-size: 1.4rem;
    }

    .autor {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 12px;
